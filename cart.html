<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Burger Barn - Cart</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --red: #c0392b; --dark: #1a1a1a; --cream: #fdf6ec; --gold: #e8a020; --gray: #555; }
    body { font-family: 'DM Sans', sans-serif; background: var(--cream); color: var(--dark); }

    nav {
      background: var(--dark); display: flex; justify-content: space-between;
      align-items: center; padding: 1rem 3rem; position: sticky; top: 0; z-index: 100;
    }
    .logo { font-family: 'Playfair Display', serif; color: var(--gold); font-size: 1.8rem; font-weight: 900; text-decoration: none; }
    nav ul { list-style: none; display: flex; gap: 2rem; }
    nav ul a { color: #fff; text-decoration: none; font-weight: 500; }
    nav ul a:hover { color: var(--gold); }
    .cart-btn { background: var(--red); color: #fff !important; padding: 0.5rem 1.2rem; border-radius: 50px; font-weight: 600 !important; }

    .page-header {
      background: var(--dark); color: #fff;
      padding: 4rem 3rem 3rem; text-align: center;
    }
    .page-header h1 { font-family: 'Playfair Display', serif; font-size: 3rem; }
    .page-header h1 span { color: var(--gold); }

    .container { max-width: 900px; margin: 3rem auto; padding: 0 2rem; }

    /* CART */
    #cart-section { display: block; }
    #checkout-section { display: none; }
    #confirmation-section { display: none; }

    .cart-empty {
      text-align: center; padding: 4rem;
      font-size: 1.1rem; color: var(--gray);
    }
    .cart-empty a { color: var(--red); font-weight: 600; text-decoration: none; }

    .cart-item {
      background: #fff; border-radius: 12px;
      padding: 1.2rem 1.5rem;
      display: flex; justify-content: space-between;
      align-items: center; margin-bottom: 1rem;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    .cart-item-name { font-weight: 600; font-size: 1rem; }
    .cart-item-price { color: var(--red); font-weight: 700; font-size: 1.1rem; }

    .remove-btn {
      background: none; border: none;
      color: #bbb; font-size: 1.2rem;
      cursor: pointer; transition: color 0.2s;
    }
    .remove-btn:hover { color: var(--red); }

    .cart-summary {
      background: var(--dark); color: #fff;
      border-radius: 16px; padding: 2rem;
      margin-top: 2rem;
    }

    .summary-row {
      display: flex; justify-content: space-between;
      margin-bottom: 0.8rem; font-size: 1rem;
    }

    .summary-total {
      display: flex; justify-content: space-between;
      font-size: 1.4rem; font-weight: 700;
      border-top: 1px solid #333;
      padding-top: 1rem; margin-top: 0.5rem;
    }

    .summary-total span:last-child { color: var(--gold); }

    .btn-checkout {
      display: block; width: 100%;
      background: var(--red); color: #fff;
      border: none; padding: 1rem;
      border-radius: 50px; font-size: 1rem;
      font-weight: 700; cursor: pointer;
      margin-top: 1.5rem;
      font-family: 'DM Sans', sans-serif;
      transition: background 0.2s;
    }
    .btn-checkout:hover { background: #a93226; }

    /* CHECKOUT FORM */
    .checkout-form { background: #fff; border-radius: 16px; padding: 2.5rem; }

    .checkout-form h2 {
      font-family: 'Playfair Display', serif;
      font-size: 1.8rem; margin-bottom: 2rem;
    }

    .form-group { margin-bottom: 1.5rem; }

    label {
      display: block; font-weight: 600;
      margin-bottom: 0.4rem; font-size: 0.95rem;
    }

    input {
      width: 100%; padding: 0.8rem 1rem;
      border: 2px solid #e0e0e0; border-radius: 8px;
      font-size: 1rem; font-family: 'DM Sans', sans-serif;
      transition: border-color 0.2s;
    }

    input:focus { outline: none; border-color: var(--gold); }

    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }

    .btn-place-order {
      width: 100%; background: var(--red); color: #fff;
      border: none; padding: 1rem; border-radius: 50px;
      font-size: 1.1rem; font-weight: 700; cursor: pointer;
      font-family: 'DM Sans', sans-serif; transition: background 0.2s;
      margin-top: 1rem;
    }
    .btn-place-order:hover { background: #a93226; }

    /* CONFIRMATION */
    .confirmation {
      text-align: center; padding: 4rem 2rem;
      background: #fff; border-radius: 16px;
    }

    .confirmation-icon { font-size: 5rem; margin-bottom: 1.5rem; }

    .confirmation h2 {
      font-family: 'Playfair Display', serif;
      font-size: 2.5rem; margin-bottom: 1rem;
    }

    .confirmation h2 span { color: var(--gold); }

    .confirmation p { color: var(--gray); font-size: 1.05rem; margin-bottom: 2rem; line-height: 1.6; }

    .order-number {
      background: var(--dark); color: var(--gold);
      display: inline-block; padding: 0.5rem 1.5rem;
      border-radius: 50px; font-weight: 700;
      font-size: 1.1rem; margin-bottom: 2rem;
    }

    .btn-back {
      background: var(--dark); color: #fff;
      padding: 0.9rem 2rem; border-radius: 50px;
      text-decoration: none; font-weight: 600;
      display: inline-block; transition: background 0.2s;
    }
    .btn-back:hover { background: var(--red); }

    footer { background: var(--dark); color: #aaa; text-align: center; padding: 2rem; font-size: 0.9rem; margin-top: 3rem; }
    footer span { color: var(--gold); }
  </style>
</head>
<body>

<nav>
  <a class="logo" href="index.html">🍔 Burger Barn</a>
  <ul>
    <li><a href="index.html">Home</a></li>
    <li><a href="menu.html">Menu</a></li>
    <li><a href="cart.html" class="cart-btn">🛒 Cart (<span id="cart-count">0</span>)</a></li>
  </ul>
</nav>

<div class="page-header">
  <h1>Your <span>Cart</span></h1>
</div>

<div class="container">

  <!-- CART SECTION -->
  <div id="cart-section">
    <div id="cart-items-list"></div>
    <div id="cart-summary-container"></div>
  </div>

  <!-- CHECKOUT SECTION -->
  <div id="checkout-section">
    <div class="checkout-form">
      <h2>Delivery Details</h2>
      <div class="form-row">
        <div class="form-group">
          <label for="first-name">First Name</label>
          <input type="text" id="first-name" placeholder="John" />
        </div>
        <div class="form-group">
          <label for="last-name">Last Name</label>
          <input type="text" id="last-name" placeholder="Doe" />
        </div>
      </div>
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" placeholder="john@example.com" />
      </div>
      <div class="form-group">
        <label for="address">Street Address</label>
        <input type="text" id="address" placeholder="123 Main St" />
      </div>
      <div class="form-row">
        <div class="form-group">
          <label for="city">City</label>
          <input type="text" id="city" placeholder="New York" />
        </div>
        <div class="form-group">
          <label for="zip">ZIP Code</label>
          <input type="text" id="zip" placeholder="10001" />
        </div>
      </div>
      <button class="btn-place-order" id="place-order-btn" onclick="placeOrder()">Place Order</button>
    </div>
  </div>

  <!-- CONFIRMATION SECTION -->
  <div id="confirmation-section">
    <div class="confirmation">
      <div class="confirmation-icon">🎉</div>
      <h2>Order <span>Confirmed!</span></h2>
      <div class="order-number" id="order-number">Order #0000</div>
      <p>Your delicious burgers are being prepared!<br>Estimated delivery: <strong>25-30 minutes</strong>.</p>
      <a href="menu.html" class="btn-back" id="back-to-menu">Back to Menu</a>
    </div>
  </div>

</div>

<footer>
  <p>&copy; 2026 <span>Burger Barn</span>. Built for QA Automation Testing.</p>
</footer>

<script>
  function getCart() { return JSON.parse(localStorage.getItem('cart') || '[]'); }
  function saveCart(cart) { localStorage.setItem('cart', JSON.stringify(cart)); }

  function updateCartCount() {
    document.getElementById('cart-count').textContent = getCart().length;
  }

  function renderCart() {
    const cart = getCart();
    const listEl = document.getElementById('cart-items-list');
    const summaryEl = document.getElementById('cart-summary-container');

    if (cart.length === 0) {
      listEl.innerHTML = `<div class="cart-empty"><p>Your cart is empty. <a href="menu.html">Browse the menu!</a></p></div>`;
      summaryEl.innerHTML = '';
      return;
    }

    listEl.innerHTML = cart.map((item, i) => `
      <div class="cart-item" id="cart-item-${i}">
        <span class="cart-item-name">${item.name}</span>
        <span class="cart-item-price">$${item.price.toFixed(2)}</span>
        <button class="remove-btn" onclick="removeItem(${i})">✕</button>
      </div>
    `).join('');

    const subtotal = cart.reduce((sum, item) => sum + item.price, 0);
    const tax = subtotal * 0.08;
    const total = subtotal + tax;

    summaryEl.innerHTML = `
      <div class="cart-summary">
        <div class="summary-row"><span>Subtotal</span><span>$${subtotal.toFixed(2)}</span></div>
        <div class="summary-row"><span>Tax (8%)</span><span>$${tax.toFixed(2)}</span></div>
        <div class="summary-total"><span>Total</span><span>$${total.toFixed(2)}</span></div>
        <button class="btn-checkout" id="checkout-btn" onclick="goToCheckout()">Proceed to Checkout →</button>
      </div>
    `;
  }

  function removeItem(index) {
    const cart = getCart();
    cart.splice(index, 1);
    saveCart(cart);
    updateCartCount();
    renderCart();
  }

  function goToCheckout() {
    document.getElementById('cart-section').style.display = 'none';
    document.getElementById('checkout-section').style.display = 'block';
  }

  function placeOrder() {
    const orderNum = Math.floor(Math.random() * 9000) + 1000;
    document.getElementById('order-number').textContent = `Order #${orderNum}`;
    document.getElementById('checkout-section').style.display = 'none';
    document.getElementById('confirmation-section').style.display = 'block';
    localStorage.removeItem('cart');
    updateCartCount();
  }

  updateCartCount();
  renderCart();
</script>
</body>
</html>
